name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "antigo/**"
  workflow_dispatch:

# Impede que dois deploys se atropelem; o mais novo espera o anterior terminar.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  DESTINO: /www/wwwroot/weslleymattos.com.br
  PM2_APP: portfolio
  SITE: https://weslleymattos.com.br/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Instalar dependencias
        # --legacy-peer-deps: bug do arborist no npm 10 com a arvore do Nuxt 4
        # PUPPETEER_SKIP_DOWNLOAD: puppeteer so e usado pelo script do curriculo,
        # nao pelo build. Sem isso o CI baixa um Chromium inteiro a cada run.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Configurar chave SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -euo pipefail

          # Sem esta checagem o passo morria no ssh-keyscan com host vazio, e o
          # 2>/dev/null escondia o motivo. Falhar aqui diz qual secret falta.
          faltando=""
          for nome in SSH_KEY SSH_HOST SSH_USER; do
            if [ -z "${!nome:-}" ]; then
              faltando="$faltando $nome"
            fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes em Settings > Secrets and variables > Actions:$faltando"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Enviar build para a VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} -o StrictHostKeyChecking=yes" \
            .output/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${DESTINO}/.output-novo/"

      - name: Trocar versao e reiniciar
        id: trocar
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DESTINO='${DESTINO}' PM2_APP='${PM2_APP}' bash -s" <<'REMOTO'
          set -euo pipefail
          cd "$DESTINO"

          # O conteudo editado pelo painel e os uploads vivem AQUI, fora do
          # .output — que e substituido inteiro a cada deploy. Criar se faltar
          # cobre o primeiro deploy e um servidor novo.
          mkdir -p dados/uploads

          # O node deste servidor vem de nvm, carregado so pelo .bashrc — que
          # uma sessao ssh nao-interativa nao le. Sem isso nao ha node nem pm2
          # no PATH.
          #
          # Carregar o nvm tambem evita uma armadilha: existe um pm2 antigo em
          # /www/server/nodejs/v14.17.6/bin/pm2 que satisfaz um teste -x mas
          # nao executa ("env: node: No such file or directory"). Procurar por
          # caminho fixo encontraria justamente esse.
          export NVM_DIR="/www/server/nvm"
          # shellcheck disable=SC1091
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1 || true

          # Nada de "teste && atribuicao" aqui: sob `set -e`, uma lista && que
          # termina em falso encerra o script inteiro.
          PM2="$(command -v pm2 || true)"
          if [ -z "$PM2" ]; then
            for candidato in /www/server/nvm/versions/node/*/bin/pm2 /usr/local/bin/pm2 /usr/bin/pm2; do
              if [ -x "$candidato" ]; then
                PM2="$candidato"
                break
              fi
            done
          fi
          if [ -z "$PM2" ]; then
            echo "pm2 nao encontrado no servidor" >&2
            exit 1
          fi
          # O shebang do pm2 chama `env node`; garante o node vizinho no PATH
          PATH="$(dirname "$PM2"):$PATH"
          export PATH
          echo "usando pm2: $PM2 ($("$PM2" -v)) com node $(node -v)"

          # Troca atomica, guardando a versao anterior para rollback.
          rm -rf .output-anterior
          if [ -d .output ]; then
            mv .output .output-anterior
          fi
          mv .output-novo .output

          # Reinicia pelo ecosystem quando ele existe: e de la que vem a senha
          # do painel e o segredo de sessao.
          #
          # ATENCAO: nada de `--update-env` no caminho simples. Essa flag faz o
          # pm2 substituir o ambiente do processo pelo ambiente do shell atual
          # — e este shell ssh nao tem as variaveis do painel. O app subiria
          # sem senha configurada e o /admin pararia de autenticar.
          if [ -f ecosystem.config.cjs ]; then
            "$PM2" restart ecosystem.config.cjs --only "$PM2_APP" --update-env
          else
            "$PM2" restart "$PM2_APP"
          fi
          "$PM2" save --force
          REMOTO

      - name: Verificar se o site voltou
        run: |
          sleep 5
          for tentativa in 1 2 3 4 5 6; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "$SITE" || echo 000)
            if [ "$codigo" = "200" ]; then
              echo "Site respondeu 200 na tentativa $tentativa"
              exit 0
            fi
            echo "tentativa $tentativa: HTTP $codigo, aguardando..."
            sleep 5
          done
          echo "::error::Site nao respondeu 200 apos o deploy"
          exit 1

      # So faz rollback se a troca chegou a acontecer. Sem esta condicao, uma
      # falha no build ou no rsync restauraria um .output-anterior antigo por
      # cima de uma versao que estava saudavel.
      - name: Rollback
        if: failure() && steps.trocar.outcome == 'success'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DESTINO='${DESTINO}' PM2_APP='${PM2_APP}' bash -s" <<'REMOTO'
          set -euo pipefail
          cd "$DESTINO"
          export NVM_DIR="/www/server/nvm"
          # shellcheck disable=SC1091
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1 || true

          if [ -d .output-anterior ]; then
            PM2="$(command -v pm2 || true)"
            if [ -z "$PM2" ]; then
              for candidato in /www/server/nvm/versions/node/*/bin/pm2 /usr/local/bin/pm2; do
                if [ -x "$candidato" ]; then PM2="$candidato"; break; fi
              done
            fi
            PATH="$(dirname "$PM2"):$PATH"
            export PATH
            rm -rf .output
            mv .output-anterior .output
            if [ -f ecosystem.config.cjs ]; then
              "$PM2" restart ecosystem.config.cjs --only "$PM2_APP" --update-env
            else
              "$PM2" restart "$PM2_APP"
            fi
            echo "rollback aplicado: versao anterior restaurada"
          else
            echo "sem versao anterior para restaurar" >&2
          fi
          REMOTO
